name: Build Pure Terminal Binary

# 锁定为纯手动触发，防盲目盲目浪费资源
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-pure-binary:
    name: Compile and Link Exploit Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. 采用标准的 SDK 动作，设置缓存 key
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk
          key: ${{ runner.os }}-ndk-r26b

      # 2. 如果缓存未命中，则通过最稳定的渠道下载 pure NDK
      - name: Download and Install Pure Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/android-ndk
          echo "[*] Downloading official Android NDK..."
          curl -fL "https://dl.google.com/android/repository/android-ndk-r30-linux.zip?hl=zh-cn" -o /home/runner/ndk.zip
          echo "[*] Unzipping NDK toolchain..."
          unzip -q /home/runner/ndk.zip -d /home/runner/android-ndk
          # 将解压出来的多级目录结构移出来，保证路径绝对整洁
          mv /home/runner/android-ndk/android-ndk-r26b/* /home/runner/android-ndk/
          rm -rf /home/runner/ndk.zip /home/runner/android-ndk/android-ndk-r26b

      # 3. 联合联合链接与机器码大融合命令
      - name: Joint Compilation and Linking (Fusion)
        run: |
          # 此时 NDK 路径 100% 被死死锁死在 /home/runner/android-ndk 之下
          export CXX=/home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
          
          echo "[*] Initializing Joint C++ Compiler via: $CXX"
          echo "[*] Fusioning core exploit structures and 4.9 layout mappings..."
          
          # 联合联合链接与机器码大融合命令
          $CXX -O3 -static-libstdc++ -Wall \
            src/core/main.cpp \
            src/core/race/pi_race.cpp \
            src/core/race/threads.cpp \
            src/core/memory/address_space.cpp \
            src/core/memory/payload_builder.cpp \
            src/core/memory/heap_context.cpp \
            src/core/session/exploit_session.cpp \
            src/core/session/runtime_config.cpp \
            src/core/support/native_resource.cpp \
            src/core/support/util.cpp \
            -I src/core/ \
            -o ghostlock_pure

          echo "[+] Linkage complete! Pure terminal binary generated successfully."
          
          # 使用配套的 llvm-strip 裁切冗余符号调试，极致缩减体积
          /home/runner/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all ghostlock_pure || true

      - name: Upload Exploit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock_pure_4.9
          path: ghostlock_pure
