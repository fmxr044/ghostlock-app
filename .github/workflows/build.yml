name: Build Pure Terminal Binary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-pure-binary:
    name: Compile and Link Exploit Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        # 使用 NDK r25c 编译器。这个版本具备最佳的向下兼容性
        # 可以防止链接时高版本 libc 导致在老旧 Linux 4.9 上发生符号丢失错
        with:
          packages: "ndk;25.3.9847514"

      - name: Joint Compilation and Linking (Fusion)
        run: |
          export NDK_PATH=$ANDROID_HOME/ndk/25.3.9847514
          export CXX=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
          
          echo "[*] Initializing Joint C++ Compiler..."
          echo "[*] Fusioning core exploit structures and 4.9 layout mappings..."
          
          # 【最核心的链接指令】
          # 只将我们修改好的提权核心源文件输入编译器
          # 彻底短路并剔除无用的 app/、profile-core/ 以及通信 route 目录
          $CXX -O3 -static-libstdc++ -Wall \
            src/core/main.cpp \
            src/core/race/pi_race.cpp \
            src/core/race/threads.cpp \
            src/core/memory/address_space.cpp \
            src/core/memory/payload_builder.cpp \
            src/core/memory/heap_context.cpp \
            src/core/session/exploit_session.cpp \
            src/core/session/runtime_config.cpp \
            src/core/support/native_resource.cpp \
            src/core/support/util.cpp \
            -I src/core/ \
            -o ghostlock_pure

          echo "[+] Linkage complete! Pure terminal binary generated successfully."
          
          # 对融合好的产物进行符号裁切以减小体积（去除调试冗余）
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all ghostlock_pure

      - name: Upload Exploit Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock_pure_4.9
          path: ghostlock_pure
