name: Build Pure Terminal Binary

# 彻底改成只在手动点击时触发，防止每次 push 盲目浪费编译时间
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-pure-binary:
    name: Compile and Link Exploit Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 弃用不稳定的三方 NDK 安装包，直接使用 Ubuntu 镜像自带的官方 NDK 路径
      - name: Locate Pre-installed Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST" >> $GITHUB_ENV
          echo "[*] Using System Default NDK Path: $ANDROID_NDK_LATEST"

      - name: Joint Compilation and Linking (Fusion)
        run: |
          # 动态读取系统自带的最新稳定版 Clang 交叉编译器
          export CXX=$NDK_ENV/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
          # 如果上一行在某些极端特定环境中变量未对齐，fallback 到标准默认高通/安卓 28 交叉编译链
          if [ ! -f "$CXX" ]; then
            export CXX=$ANDROID_NDK_LATEST/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
          fi
          
          echo "[*] Initializing Joint C++ Compiler via: $CXX"
          echo "[*] Fusioning core exploit structures and 4.9 layout mappings..."
          
          # 联合联合链接与机器码大融合命令
          $CXX -O3 -static-libstdc++ -Wall \
            src/core/main.cpp \
            src/core/race/pi_race.cpp \
            src/core/race/threads.cpp \
            src/core/memory/address_space.cpp \
            src/core/memory/payload_builder.cpp \
            src/core/memory/heap_context.cpp \
            src/core/session/exploit_session.cpp \
            src/core/session/runtime_config.cpp \
            src/core/support/native_resource.cpp \
            src/core/support/util.cpp \
            -I src/core/ \
            -o ghostlock_pure

          echo "[+] Linkage complete! Pure terminal binary generated successfully."
          
          # 使用配套的 llvm-strip 裁切冗余符号调试，极致缩减体积
          STRIP_TOOL=$(dirname "$CXX")/llvm-strip
          $STRIP_TOOL --strip-all ghostlock_pure || true

      - name: Upload Exploit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock_pure_4.9
          path: ghostlock_pure
